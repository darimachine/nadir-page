    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .t-coord {
    font-family: var(--f-mono);
    font-size: .8125rem;
    letter-spacing: .02em;
  }
  .t-small {
    font-size: .875rem;
    line-height: 1.5;
  }
  .measure {
    max-width: 62ch;
  }
  .ph {
    display: inline-block;
    padding: 0 .4em;
    border: 1px dashed currentColor;
    border-radius: 3px;
    font-family: var(--f-mono);
    font-size: .85em;
    color: var(--signal);
    white-space: nowrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    min-height: 48px;
    padding: 0 1.25rem;
    font-weight: 500;
    font-size: 1rem;
    border-radius: 999px;
    transition: background-color .2s, color .2s, border-color .2s, transform .2s;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active {
    transform: translateY(1px);
  }
  .btn-signal {
    background: var(--night-signal);
    color: #1A0E05;
  }
  .btn-signal:hover {
    background: #F6A06A;
  }
  .btn-ink {
    background: var(--ink);
    color: var(--paper);
  }
  .btn-ink:hover {
    background: var(--signal);
    color: #fff;
  }
  :root[data-theme="dark"] .btn-ink:hover {
    color: #1A0E05;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-ink:hover {
      color: #1A0E05;
    }
  }
  .btn-ghost-night {
    border: 1px solid var(--night-line);
    color: var(--night-fg);
  }
  .btn-ghost-night:hover {
    border-color: var(--night-ice);
    color: #fff;
  }
  .btn-ghost {
    border: 1px solid var(--rule);
    color: var(--ink);
  }
  .btn-ghost:hover {
    border-color: var(--ink);
  }
  .link {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: var(--rule);
    transition: text-decoration-color .2s;
  }
  .link:hover {
    text-decoration-color: currentColor;
  }
  .field {
    width: 100%;
    min-height: 48px;
    padding: .7rem .9rem;
    border: 1px solid var(--field-line);
    border-radius: 8px;
    background: var(--raised);
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus {
    outline: none;
    border-color: var(--ice);
    box-shadow: 0 0 0 3px var(--ice-soft);
  }
  .field[aria-invalid="true"] {
    border-color: var(--signal);
  }
}
.rv {
  transition: opacity .8s cubic-bezier(.16,.84,.24,1), transform .8s cubic-bezier(.16,.84,.24,1);
}
.rv.rv-pre {
  opacity: 0;
  transform: translate3d(0, 18px, 0);
}
@keyframes sweep {
  to {
    transform: rotate(360deg);
  }
}
@keyframes ping {
  0% {
    opacity: .9;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(2.4);
  }
}
@keyframes dash {
  to {
    stroke-dashoffset: -24;
  }
}
@keyframes draw {
  from {
    stroke-dashoffset: 1;
  }
  to {
    stroke-dashoffset: 0;
  }
}
.anim-sweep {
  transform-box: fill-box;
  transform-origin: center;
  animation: sweep 9s linear infinite;
}
.anim-ping {
  transform-box: fill-box;
  transform-origin: center;
  animation: ping 2.2s ease-out infinite;
}
.anim-dash {
  stroke-dasharray: 4 8;
  animation: dash 1.4s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .rv.rv-pre {
    opacity: 1;
    transform: none;
  }
}
